[project]
name = "ocasion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Lara", email = "juanelara03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ocasion = "ocasion:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI usa File() y Form() como valores por defecto
[tool.pytest.ini_options]
testpaths = ["tests"]
